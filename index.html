<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>TechBravery | Software Development & Digital Solutions</title>

    <meta
      name="description"
      content="TechBravery builds custom software, digital products, and technology solutions for businesses."
    />

    <meta name="author" content="TechBravery" />
    <meta
      name="description"
      content="Discover Techbravery's technology solutions, digital products, and services designed to help businesses grow."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Replace with your real production domain -->
    <link rel="canonical" href="https://techbravery.com/" />

    <!-- Favicon: ensure this file actually exists in public/ -->
    <link rel="icon" type="image/png" href="/logo-dark-icon.png" />

    <!-- Open Graph: WhatsApp, LinkedIn, Facebook, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Techbravery" />
    <meta property="og:title" content="Techbravery | Technology Solutions" />
    <meta
      property="og:description"
      content="Discover Techbravery's technology solutions, digital products, and services designed to help businesses grow."
    />
    <meta property="og:url" content="https://techbravery.com/" />
    <meta property="og:image" content="https://techbravery.com/og-image.jpg" />
    <meta property="og:image:alt" content="Techbravery technology solutions" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Techbravery | Technology Solutions" />
    <meta
      name="twitter:description"
      content="Discover Techbravery's technology solutions, digital products, and services designed to help businesses grow."
    />
    <meta name="twitter:image" content="https://techbravery.com/og-image.jpg" />

    <meta name="author" content="Techbravery" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
